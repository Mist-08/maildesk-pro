# Perfil LOCAL: arranque sin PostgreSQL ni Docker (H2 en archivo, modo PostgreSQL).
# Pensado para NetBeans y demostraciones. No usar en produccion.
spring:
  datasource:
    url: jdbc:h2:file:./data/maildesk-local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  thymeleaf:
    cache: false
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
app:
  allow-generated-otp-key: true
  mail:
    from: ${MAIL_FROM:maildesk@localhost.test}
    real: ${APP_MAIL_REAL:false}
logging:
  level:
    com.mycompany.maildesk: DEBUG
