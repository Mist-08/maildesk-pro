spring:
  application:
    name: maildesk-pro
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  thymeleaf:
    cache: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:false}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.ssl.protocols: TLSv1.2 TLSv1.3
      mail.smtp.connectiontimeout: ${MAIL_CONNECT_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:20000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:20000}
      mail.mime.address.strict: true
  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${APP_PORT:8080}
  forward-headers-strategy: ${APP_FORWARD_HEADERS:none}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
    include-binding-errors: never
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:30m}
      cookie:
        name: MDSESSION
        http-only: true
        same-site: lax
        secure: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    com.mycompany.maildesk: INFO

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  initial-admin-email: ${APP_INITIAL_ADMIN_EMAIL:}
  setup-secret: ${APP_SETUP_SECRET:}
  otp-hmac-secret: ${APP_OTP_HMAC_SECRET:}
  otp-hmac-key-file: ${APP_OTP_HMAC_KEY_FILE:./data/otp-hmac.key}
  allow-generated-otp-key: false
  storage-dir: ${APP_STORAGE_DIR:./data/storage}
  mail:
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:MailDesk Pro}
    real: ${APP_MAIL_REAL:false}
    concurrency: ${APP_MAIL_CONCURRENCY:2}
    max-attempts: ${APP_MAIL_MAX_ATTEMPTS:3}
    retry-backoff-seconds: 60
    quota-per-user-per-day: ${APP_MAIL_QUOTA_PER_USER_PER_DAY:200}
    max-recipients-per-message: ${APP_MAIL_MAX_RECIPIENTS:50}
  outbox:
    scheduler-enabled: true
    poll-delay-ms: 5000
    batch-size: 10
  attachments:
    max-count: 10
    max-file-bytes: 10485760
    max-total-bytes: 26214400
  security:
    otp-ttl-seconds: 300
    otp-max-attempts: 5
    otp-resend-interval-seconds: 60
    otp-max-requests-per-hour: 5
    otp-max-requests-per-ip-per-hour: 20
    login-max-failures: 5
    login-lock-minutes: 15
    login-max-attempts-per-ip-per-15min: 30
    reset-token-ttl-minutes: 30
    invite-ttl-hours: 72
    reset-max-requests-per-ip-per-hour: 10
