<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: layout(~{::title}, ~{::article})}">
<head><title>Iniciar sesión · MailDesk Pro</title></head>
<body>
<article>
    <h2>Iniciar sesión</h2>
    <p class="muted small">Después de la contraseña te enviaremos un código de verificación a tu correo.</p>
    <div th:if="${param.logout}" class="alert alert-info" role="status">Cerraste sesión correctamente.</div>
    <div th:if="${param.revoked}" class="alert alert-info" role="status">Tu sesión fue cerrada por seguridad. Inicia sesión de nuevo.</div>
    <form method="post" th:action="@{/login}" novalidate>
        <div class="field">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" th:value="${email}" required autocomplete="username" autofocus maxlength="320">
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="128">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Continuar</button>
        </div>
    </form>
    <div class="auth-links">
        <a th:href="@{/password/forgot}">¿Olvidaste tu contraseña?</a>
    </div>
</article>
</body>
</html>
