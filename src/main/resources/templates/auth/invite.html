<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/auth :: layout(~{::title}, ~{::article})}">
<head><title>Aceptar invitación · MailDesk Pro</title></head>
<body>
<article>
    <h2>Aceptar invitación</h2>
    <div th:if="${invalid}" class="alert alert-error" role="alert">
        La invitación no es válida, ya fue utilizada o venció. Pide a tu administrador una nueva.
    </div>
    <form th:unless="${invalid}" method="post" th:action="@{/invite/accept}" novalidate>
        <input type="hidden" name="token" th:value="${token}">
        <div class="field">
            <label for="email">Correo</label>
            <input type="email" id="email" th:value="${email}" readonly aria-readonly="true">
        </div>
        <div class="field">
            <label for="displayName">Tu nombre</label>
            <input type="text" id="displayName" name="displayName" th:value="${displayName}" required maxlength="120" autocomplete="name" autofocus>
        </div>
        <div class="form-row">
            <div class="field">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="passwordConfirm">Confirmar contraseña</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" required minlength="10" maxlength="128" autocomplete="new-password">
            </div>
        </div>
        <p class="hint">Mínimo 10 caracteres combinando letras con números o símbolos.</p>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Crear mi cuenta</button>
        </div>
    </form>
    <div class="auth-links"><a th:href="@{/login}">Ir a iniciar sesión</a></div>
</article>
</body>
</html>
