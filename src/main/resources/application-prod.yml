# Perfil PROD: todo proviene de variables de entorno (ver .env.example).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  thymeleaf:
    cache: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_STARTTLS:true}
      mail.smtp.ssl.enable: ${MAIL_SSL:false}
      mail.smtp.ssl.checkserveridentity: true
server:
  forward-headers-strategy: ${APP_FORWARD_HEADERS:native}
  servlet:
    session:
      cookie:
        secure: ${APP_COOKIE_SECURE:true}
app:
  allow-generated-otp-key: false
  mail:
    real: ${APP_MAIL_REAL:true}
logging:
  level:
    com.mycompany.maildesk: INFO
